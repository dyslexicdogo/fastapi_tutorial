<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login · My Budget App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> * { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">

  <div class="w-full max-w-sm">

    <!-- Logo / title -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-blue-600
                  flex items-center justify-center shadow-lg mx-auto mb-4">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11
                   0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11
                   0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">My Budget App</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in to continue</p>
    </div>

    <!-- Login card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

      <!-- Error message (hidden until needed) -->
      <div id="errorMsg"
           class="hidden mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200
                  text-red-700 text-sm">
        Incorrect username or password.
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">
            Username
          </label>
          <input id="username" type="text" autocomplete="username"
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500
                        focus:border-transparent"
                 placeholder="admin">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">
            Password
          </label>
          <input id="password" type="password" autocomplete="current-password"
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500
                        focus:border-transparent"
                 placeholder="••••••••">
        </div>

        <button id="loginBtn"
                class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700
                       text-white font-medium rounded-lg text-sm transition
                       focus:outline-none focus:ring-2 focus:ring-indigo-500">
          Sign in
        </button>
      </div>
    </div>
  </div>

  <script>
    // Clear any existing token when the login page loads
    localStorage.removeItem('token');

    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn      = document.getElementById('loginBtn');
    const errorMsg      = document.getElementById('errorMsg');

    async function doLogin() {
      // Disable button to prevent double-submit
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';
      errorMsg.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value,
          }),
        });

        if (res.ok) {
          const data = await res.json();
          // Store the JWT — all subsequent API calls read from here
          localStorage.setItem('token', data.access_token);
          window.location.href = '/entry';
        } else {
          errorMsg.classList.remove('hidden');
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        errorMsg.textContent = 'Network error — is the server running?';
        errorMsg.classList.remove('hidden');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign in';
      }
    }

    // Sign in on button click
    loginBtn.addEventListener('click', doLogin);

    // Sign in on Enter key from either input
    [usernameInput, passwordInput].forEach(el => {
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
      });
    });
  </script>
</body>
</html>
