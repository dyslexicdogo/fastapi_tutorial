<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My Budget App</title>
  <!-- Tailwind CSS + Google Fonts + Font Awesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body {
      background: #468faf;
    }
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-track { background: #012a4a; border-radius: 10px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #013a63; border-radius: 10px; }
    .pulse-dot {
      animation: softPulse 1.2s infinite ease-in-out;
    }
    @keyframes softPulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="antialiased">

  <div class="flex min-h-screen relative">

    <!-- ========== COLLAPSIBLE SIDEBAR (Hamburger menu) ========== -->
    <aside id="sidebar" class="fixed z-50 w-72 bg-[#012a4a] shadow-2xl border-r border-[#013a63] transition-all duration-300 ease-in-out transform -translate-x-full h-full overflow-y-auto sidebar-scroll"
           style="top:0; left:0; bottom:0;">
      <div class="flex flex-col h-full">
        <!-- Sidebar header -->
        <div class="flex items-center justify-between px-6 py-5 border-b border-[#013a63]">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-[#01497c] to-[#2a6f97] flex items-center justify-center shadow-md">
              <i class="fas fa-chart-line text-white text-sm"></i>
            </div>
            <span class="text-[#61a5c2] font-bold text-xl tracking-tight">Menu</span>
          </div>
          <button id="closeSidebarBtn" class="text-[#89c2d9] hover:text-white transition">
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        
        <!-- navigation menu (different pages) -->
        <nav class="flex-1 py-6 px-4 space-y-2">
          <a href="/entry" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-[#89c2d9] hover:bg-[#013a63] hover:text-white transition group">
            <i class="fas fa-coins w-5 text-emerald-400"></i>
            <span class="font-medium">Budget entry</span>
          </a>
          <a href="/view" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-[#89c2d9] hover:bg-[#013a63] hover:text-white transition group">
            <i class="fas fa-calendar-alt w-5 text-sky-400"></i>
            <span class="font-medium">Budget view</span>
          </a>
          <a href="/charts" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-[#89c2d9] hover:bg-[#013a63] hover:text-white transition group">
            <i class="fas fa-chart-bar w-5 text-amber-400"></i>
            <span class="font-medium">Charts</span>
          </a>
          <a href="/login" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-[#89c2d9] hover:bg-[#013a63] hover:text-white transition group">
            <i class="fas fa-sign-out-alt w-5 text-gray-400"></i>
            <span class="font-medium">Logout</span>
          </a>
        </nav>
      </div>
    </aside>

    <!-- overlay for mobile sidebar -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden transition-all"></div>

    <!-- ========== MAIN CONTENT AREA ========== -->
    <main class="flex-1 flex flex-col min-h-screen">
      
      <!-- Top navbar with hamburger & status icons -->
      <header class="bg-[#a9d6e5]/80 backdrop-blur-sm sticky top-0 z-30 border-b border-[#89c2d9] shadow-sm">
        <div class="px-5 md:px-8 py-4 flex items-center justify-between">
          <div class="flex items-center gap-4">
            <!-- hamburger button (mobile) -->
            <button id="hamburgerBtn" class="text-[#013a63] focus:outline-none md:hidden">
              <i class="fas fa-bars text-2xl"></i>
            </button>
            <!-- desktop sidebar toggle -->
            <button id="desktopSidebarToggle" class="hidden md:flex text-[#468faf] hover:text-[#012a4a] transition p-1 rounded-lg">
              <i class="fas fa-bars text-xl"></i>
            </button>
            <div class="hidden md:block">
              <h1 class="text-xl font-bold text-[#012a4a] tracking-tight">Budget dashboard</h1>
            </div>
          </div>

          <!-- STATUS ICONS GROUP (live sync / notifications / cloud status) -->
          <div class="flex items-center gap-4">
            <!-- user avatar shortcut -->
            <div class="flex items-center gap-2 border-l border-[#89c2d9] pl-3 ml-1">
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-[#01497c] to-[#2a6f97] flex items-center justify-center text-white text-sm font-semibold shadow-md">
                S
              </div>
              <i class="fas fa-chevron-down text-[#468faf] text-xs hidden sm:block"></i>
            </div>
          </div>
        </div>
        <!-- mobile heading -->
        <div class="px-5 pb-3 md:hidden">
          <h1 class="text-lg font-bold text-[#012a4a]">Budget dashboard</h1>
        </div>
      </header>

      <!-- MAIN BLOCK: dynamic content placeholder for FastAPI / Jinja2 -->
      <div class="flex-1 px-4 md:px-8 py-6 md:py-8">
        <!-- heading with placeholder {{ title }} -->
        <div class="mb-6">
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-[#012a4a] flex items-center gap-2">
            <i class="fas fa-bucket text-[#01497c] text-2xl"></i> 
            {{ title }}
          </h1>
        </div>

        <!-- JINJA2 BLOCK: start block / endblock (child templates will inject content) -->
        {% block content %}{% endblock %}
      </div>

      <!-- simple footer (personal project, no legalese, clean) -->
      <footer class="border-t border-[#89c2d9] bg-[#a9d6e5]/40 backdrop-blur-sm py-4 px-6 md:px-8 mt-4">
        <div class="flex justify-between items-center text-xs text-[#468faf]">
          <div class="flex items-center gap-2">
            <i class="fas fa-chart-pie text-[#2a6f97] text-xs"></i>
            <span>Personal budget tracker</span>
          </div>
          <div>
            <span>v1.0 · self-hosted</span>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <script src="{{ url_for('static', path='js/myscript.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
