{% extends "base.html" %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  <div class="bg-white rounded-2xl shadow-lg border border-[#89c2d9] p-6 h-80 flex flex-col">
    <div class="text-[#01497c] font-semibold text-sm mb-2">Cumulative Rollover</div>
    <div class="flex-1 min-h-0"><canvas id="chart1"></canvas></div>
  </div>
  <div class="bg-white rounded-2xl shadow-lg border border-[#89c2d9] p-6 h-80 flex flex-col">
    <div class="text-[#01497c] font-semibold text-sm mb-2">Monthly Spending</div>
    <div class="flex-1 min-h-0"><canvas id="chart2"></canvas></div>
  </div>
  <div class="bg-white rounded-2xl shadow-lg border border-[#89c2d9] p-6 h-80 flex flex-col">
    <div class="text-[#01497c] font-semibold text-sm mb-2">Spending by Category</div>
    <div class="flex-1 min-h-0"><svg id="chart3" width="100%" height="100%"></svg></div>
  </div>
  <div class="bg-white rounded-2xl shadow-lg border border-[#89c2d9] p-6 h-80 flex flex-col">
    <div class="text-[#01497c] font-semibold text-sm mb-2">Budget Flow</div>
    <div class="flex-1 min-h-0" id="chart4"></div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun',
                'Jul','Aug','Sep','Oct','Nov','Dec'];

function token()      { return localStorage.getItem('token'); }
function apiHeaders() {
  return { 'Content-Type':'application/json', 'Authorization':`Bearer ${token()}` };
}

async function loadRolloverChart() {
  try {
    const res = await fetch('/api/rollover-over-time', { headers: apiHeaders() });
    if (!res.ok) { if (res.status === 401) { location.href = '/login'; return; }
                   throw new Error(`HTTP ${res.status}`); }
    const data = await res.json();
    new Chart(document.getElementById('chart1'), {
      type: 'line',
      data: {
        labels: data.map(d => `${MONTHS[d.month - 1]} ${d.year}`),
        datasets: [{
          label: 'Cumulative rollover',
          data: data.map(d => d.cumulative_balance),
          borderColor: '#01497c',
          backgroundColor: 'rgba(1,73,124,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointHoverRadius: 5,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { callback: v => '£' + v.toLocaleString() } } }
      }
    });
  } catch(err) { console.error('Rollover chart error:', err); }
}

async function loadExpensesChart() {
  try {
    const res = await fetch('/api/expenses-over-time', { headers: apiHeaders() });
    if (!res.ok) { if (res.status === 401) { location.href = '/login'; return; }
                   throw new Error(`HTTP ${res.status}`); }
    const data = await res.json();
    new Chart(document.getElementById('chart2'), {
      type: 'line',
      data: {
        labels: data.map(d => `${MONTHS[d.month - 1]} ${d.year}`),
        datasets: [{
          label: 'Total spent',
          data: data.map(d => d.total_spent),
          borderColor: '#e65c4f',
          backgroundColor: 'rgba(230,92,79,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointHoverRadius: 5,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { callback: v => '£' + v.toLocaleString() } } }
      }
    });
  } catch(err) { console.error('Expenses chart error:', err); }
}

async function loadCategoryTreemap() {
  try {
    const res = await fetch('/api/category-spending', { headers: apiHeaders() });
    if (!res.ok) { if (res.status === 401) { location.href = '/login'; return; }
                   throw new Error(`HTTP ${res.status}`); }
    const data = await res.json();
    const el = document.getElementById('chart3');
    const width = el.parentElement.clientWidth;
    const height = el.parentElement.clientHeight;
    el.setAttribute('viewBox', `0 0 ${width} ${height}`);

    const root = d3.hierarchy(data).sum(d => d.value);
    d3.treemap().size([width, height]).paddingOuter(4).paddingInner(2)(root);

    const color = d3.scaleOrdinal(d3.schemeTableau10);
    const g = d3.select(el).append('g');
    const cell = g.selectAll('g').data(root.leaves()).join('g')
      .attr('transform', d => `translate(${d.x0},${d.y0})`);

    cell.append('rect')
      .attr('width',  d => Math.max(0, d.x1 - d.x0))
      .attr('height', d => Math.max(0, d.y1 - d.y0))
      .attr('fill', d => color(d.parent.data.name))
      .attr('fill-opacity', 0.85)
      .attr('rx', 3);

    cell.append('text').attr('x', 4).attr('y', 14)
      .attr('font-size', '11px').attr('font-weight', '600').attr('fill', '#fff')
      .text(d => d.data.name);

    cell.append('text').attr('x', 4).attr('y', 28)
      .attr('font-size', '10px').attr('fill', 'rgba(255,255,255,0.85)')
      .text(d => '£' + d.data.value.toLocaleString());
  } catch(err) { console.error('Treemap error:', err); }
}

async function loadSankeyChart() {
  try {
    const res = await fetch('/api/sankey', { headers: apiHeaders() });
    if (!res.ok) { if (res.status === 401) { location.href = '/login'; return; }
                   throw new Error(`HTTP ${res.status}`); }
    const raw = await res.json();
    if (!raw.nodes || !raw.nodes.length) return;

    // ── Reorder nodes so rollover is always last ─────────────────────────
    // Plotly's auto-layout places last sink nodes at the bottom of their
    // column, so moving rollover to the end is all we need — no x/y hacks.
    const ROLLOVER_KW = ['rollover', 'roll over', 'roll-over', 'balance'];
    const isRollover  = name => ROLLOVER_KW.some(k => (name||'').toLowerCase().includes(k));

    // Build a new ordering: non-rollover nodes first, rollover nodes last
    const order = [
      ...raw.nodes.map((_,i) => i).filter(i => !isRollover(raw.nodes[i].name)),
      ...raw.nodes.map((_,i) => i).filter(i =>  isRollover(raw.nodes[i].name)),
    ];

    // Create a remapping from old index → new index
    const remap = {};
    order.forEach((oldIdx, newIdx) => { remap[oldIdx] = newIdx; });

    const nodes = order.map(i => raw.nodes[i]);
    const links = raw.links.map(l => ({
      source: remap[l.source],
      target: remap[l.target],
      value:  l.value,
    }));

    // ── Colours ──────────────────────────────────────────────────────────
    const PALETTE        = ['#01497c','#e65c4f','#2a9d8f','#8338ec','#f4a261',
                            '#457b9d','#6d6875','#b5838d','#3a86ff','#06d6a0'];
    const ROLLOVER_COLOR = '#94a3b8'; // slate — visually distinct

    let pi = 0;
    const nodeColors = nodes.map(n =>
      isRollover(n.name) ? ROLLOVER_COLOR : PALETTE[pi++ % PALETTE.length]
    );

    const linkColors = links.map(l => {
      const h = nodeColors[l.source];
      const r = parseInt(h.slice(1,3),16);
      const g = parseInt(h.slice(3,5),16);
      const b = parseInt(h.slice(5,7),16);
      return `rgba(${r},${g},${b},0.35)`;
    });

    // ── Plot — let Plotly handle all layout automatically ─────────────────
    Plotly.newPlot(document.getElementById('chart4'), [{
      type: 'sankey',
      orientation: 'h',
      arrangement: 'snap',   // free auto-layout, no fixed coords
      node: {
        pad:       20,
        thickness: 20,
        line: { color: 'rgba(0,0,0,0.08)', width: 0.5 },
        label: nodes.map(n => n.name),
        color: nodeColors,
        hovertemplate: '<b>%{label}</b><br>£%{value:,.0f}<extra></extra>',
      },
      link: {
        source: links.map(l => l.source),
        target: links.map(l => l.target),
        value:  links.map(l => l.value),
        color:  linkColors,
        hovertemplate: '%{source.label} → %{target.label}<br>£%{value:,.0f}<extra></extra>',
      }
    }], {
      paper_bgcolor: 'transparent',
      plot_bgcolor:  'transparent',
      font: { family: 'Inter, system-ui, sans-serif', size: 11, color: '#334155' },
      margin: { l: 0, r: 0, t: 4, b: 4 },
    }, {
      responsive:     true,
      displayModeBar: false,
    });
  } catch(err) { console.error('Sankey error:', err); }
}

loadRolloverChart();
loadExpensesChart();
loadCategoryTreemap();
loadSankeyChart();
</script>
{% endblock %}
