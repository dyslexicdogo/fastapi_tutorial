{% extends "base.html" %}

{% block content %}
<div class="bg-white rounded-2xl shadow-lg p-6 overflow-x-auto">
  <div id="loadingMsg" class="text-slate-500 py-8 text-center">Loading view data…</div>
  <div id="errorMsg" class="hidden mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm"></div>

  <div id="viewContainer" class="hidden">
    <table class="w-full text-sm whitespace-nowrap" id="viewTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="mt-6 flex items-center justify-center gap-4">
      <button id="prevBtn" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium rounded-lg transition disabled:opacity-40 disabled:cursor-not-allowed" disabled>← Prev</button>
      <span id="pageInfo" class="text-sm text-slate-500"></span>
      <button id="nextBtn" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium rounded-lg transition disabled:opacity-40 disabled:cursor-not-allowed">Next →</button>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const thead    = document.getElementById('tableHead');
const tbody    = document.getElementById('tableBody');
const loading  = document.getElementById('loadingMsg');
const errorMsg = document.getElementById('errorMsg');
const viewWrap = document.getElementById('viewContainer');
const prevBtn  = document.getElementById('prevBtn');
const nextBtn  = document.getElementById('nextBtn');
const pageInfo = document.getElementById('pageInfo');

let currentOffset = 0;
let hasMore = false;
let buckets = [];

function token() { return localStorage.getItem('token'); }

function apiHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${token()}`,
  };
}

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.classList.remove('hidden');
}

function hideError() {
  errorMsg.classList.add('hidden');
}

async function loadBuckets() {
  try {
    const res = await fetch('/api/rollover', { headers: apiHeaders() });
    if (res.ok) {
      const data = await res.json();
      buckets = data.map(r => ({ id: r.bucket_id, name: r.display_name, balance: r.cumulative_balance }));
    }
  } catch (_) {}
}

function buildHeader() {
  const tr = document.createElement('tr');
  tr.className = 'border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider';

  const thMonth = document.createElement('th');
  thMonth.className = 'text-left py-2 pr-4 sticky left-0 bg-white';
  thMonth.textContent = 'Year-Month';
  tr.appendChild(thMonth);

  buckets.forEach(b => {
    const th = document.createElement('th');
    th.className = 'text-right py-2 px-2 min-w-[90px]';
    th.textContent = b.name;
    tr.appendChild(th);
  });

  const thSum = document.createElement('th');
  thSum.className = 'text-right py-2 pl-2 min-w-[90px] border-l border-slate-200';
  thSum.textContent = 'Monthly sum';
  tr.appendChild(thSum);

  thead.innerHTML = '';
  thead.appendChild(tr);
}

function buildRolloverRow() {
  const tr = document.createElement('tr');
  tr.className = 'border-b-2 border-slate-300 bg-slate-50';

  const tdLabel = document.createElement('td');
  tdLabel.className = 'py-2 pr-4 font-semibold text-slate-700 text-xs uppercase tracking-wider sticky left-0 bg-slate-50';
  tdLabel.textContent = 'Rollover';
  tr.appendChild(tdLabel);

  const total = buckets.reduce((s, b) => s + b.balance, 0);

  buckets.forEach(b => {
    const td = document.createElement('td');
    td.className = 'py-2 px-2 text-right text-sm font-medium text-slate-800';
    td.textContent = `\u00A3${b.balance.toFixed(2)}`;
    tr.appendChild(td);
  });

  const tdTotal = document.createElement('td');
  tdTotal.className = 'py-2 pl-2 text-right text-sm font-bold text-slate-900 border-l border-slate-200';
  tdTotal.textContent = `\u00A3${total.toFixed(2)}`;
  tr.appendChild(tdTotal);

  tbody.appendChild(tr);
}

function updatePagination() {
  prevBtn.disabled = currentOffset === 0;
  nextBtn.disabled = !hasMore;
  pageInfo.textContent = `Page ${currentOffset + 1}`;
}

async function loadView() {
  hideError();
  loading.classList.remove('hidden');
  viewWrap.classList.add('hidden');

  try {
    const res = await fetch(`/api/view?offset=${currentOffset}`, { headers: apiHeaders() });
    if (!res.ok) {
      if (res.status === 401) { window.location.href = '/login'; return; }
      throw new Error(`Server error ${res.status}`);
    }
    const data = await res.json();

    tbody.innerHTML = '';
    buildRolloverRow();
    data.months.forEach(m => renderMonth(m));

    hasMore = data.has_more;
    updatePagination();

    loading.classList.add('hidden');
    viewWrap.classList.remove('hidden');
  } catch (err) {
    loading.classList.add('hidden');
    showError(err.message);
  }
}

function renderMonth(m) {
  const byId = {};
  let sumAlloc = 0, sumSpent = 0, allComplete = true;
  m.entries.forEach(e => {
    byId[e.bucket_id] = e;
    sumAlloc += e.allocated || 0;
    if (e.spent != null) sumSpent += e.spent;
    else allComplete = false;
  });

  const monthLabel = `${MONTHS[m.month - 1]} ${m.year}`;
  const labelClass = 'py-2 pr-4 font-medium text-slate-800 sticky left-0 bg-white';

  const trAlloc = document.createElement('tr');
  trAlloc.className = 'border-b border-slate-100';

  const tdLabel = document.createElement('td');
  tdLabel.className = labelClass;
  tdLabel.rowSpan = 2;
  tdLabel.textContent = monthLabel;
  trAlloc.appendChild(tdLabel);

  buckets.forEach(b => {
    const e = byId[b.id];
    const td = document.createElement('td');
    td.className = 'py-1 px-2 text-right text-slate-700 text-xs';
    td.textContent = e && e.allocated != null ? `\u00A3${e.allocated.toFixed(2)}` : '—';
    trAlloc.appendChild(td);
  });

  const tdSumAlloc = document.createElement('td');
  tdSumAlloc.className = 'py-1 px-2 text-right text-xs font-medium text-slate-800 border-l border-slate-200';
  tdSumAlloc.textContent = `\u00A3${sumAlloc.toFixed(2)}`;
  trAlloc.appendChild(tdSumAlloc);

  tbody.appendChild(trAlloc);

  const trSpent = document.createElement('tr');
  trSpent.className = 'border-b border-slate-200';

  buckets.forEach(b => {
    const e = byId[b.id];
    const td = document.createElement('td');
    td.className = 'py-1 px-2 text-right text-slate-700 text-xs';
    td.textContent = e && e.spent != null ? `\u00A3${e.spent.toFixed(2)}` : '—';
    trSpent.appendChild(td);
  });

  const tdSumSpent = document.createElement('td');
  tdSumSpent.className = 'py-1 px-2 text-right text-xs font-medium text-slate-800 border-l border-slate-200';
  tdSumSpent.textContent = allComplete ? `\u00A3${sumSpent.toFixed(2)}` : '—';
  trSpent.appendChild(tdSumSpent);

  tbody.appendChild(trSpent);
}

prevBtn.addEventListener('click', () => {
  if (currentOffset === 0) return;
  currentOffset--;
  loadView();
});

nextBtn.addEventListener('click', () => {
  if (!hasMore) return;
  currentOffset++;
  loadView();
});

loadBuckets().then(() => {
  buildHeader();
  loadView();
});
</script>
{% endblock %}
