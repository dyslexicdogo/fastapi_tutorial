{% extends "base.html" %}

{% block extra_head %}
<style>
  .tabnum { font-variant-numeric: tabular-nums; }

  /* Category header band colors */
  .cat-fixed    { background: #012a4a; color: white; }
  .cat-monthly  { background: #013a63; color: white; }
  .cat-annual   { background: #01497c; color: white; }
  .cat-expected { background: #014f86; color: white; }
  .cat-unknown  { background: #2a6f97; color: white; }
  .cat-yolo     { background: #2c7da0; color: white; }
  .cat-sum      { background: #012a4a; color: white; }

  /* Sub-header row (bucket names) */
  .sub-fixed    { background: #013a63; color: #a9d6e5; }
  .sub-monthly  { background: #01497c; color: #89c2d9; }
  .sub-annual   { background: #014f86; color: #a9d6e5; }
  .sub-expected { background: #2a6f97; color: #a9d6e5; }
  .sub-unknown  { background: #2c7da0; color: #e0f2fe; }
  .sub-yolo     { background: #468faf; color: white; }

  /* Row type badge */
  .type-a { color: #01497c; font-size: 10px; font-weight: 600;
             letter-spacing: .04em; }
  .type-s { color: #2a6f97; font-size: 10px; font-weight: 600;
             letter-spacing: .04em; }
  .type-d { color: #6b21a8; font-size: 10px; font-weight: 600;
             letter-spacing: .04em; }

  /* Month cell hover */
  .month-link:hover { color: #01497c; text-decoration: underline; cursor: pointer; }

  /* Scrollable table wrapper */
  .tbl-scroll { overflow-x: auto; border-radius: 12px;
                border: 1px solid #89c2d9; }
  .tbl-scroll::-webkit-scrollbar { height: 6px; }
  .tbl-scroll::-webkit-scrollbar-track { background: #a9d6e5; }
  .tbl-scroll::-webkit-scrollbar-thumb { background: #89c2d9; border-radius: 3px; }
</style>
{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-[#89c2d9]">

  <!-- Loading / error -->
  <div id="loadingMsg" class="text-[#468faf] py-12 text-center text-sm">
    Loading data…
  </div>
  <div id="errorMsg"
       class="hidden mx-6 mt-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200
              text-red-700 text-sm"></div>

  <div id="viewContainer" class="hidden">

    <!-- Scrollable table -->
    <div class="tbl-scroll mx-6 mt-6">
      <table class="w-full text-sm whitespace-nowrap" id="viewTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-between px-6 py-4 border-t border-[#89c2d9] mt-4">
      <button id="olderBtn"
              class="px-5 py-2 bg-[#a9d6e5] hover:bg-[#89c2d9] text-[#013a63] text-sm
                     font-medium rounded-lg transition disabled:opacity-40
                     disabled:cursor-not-allowed flex items-center gap-2">
        ← Older
      </button>
      <span id="pageInfo" class="text-xs text-[#468faf] font-medium uppercase
                                  tracking-wider"></span>
      <button id="newerBtn"
              class="px-5 py-2 bg-[#a9d6e5] hover:bg-[#89c2d9] text-[#013a63] text-sm
                     font-medium rounded-lg transition disabled:opacity-40
                     disabled:cursor-not-allowed flex items-center gap-2"
              disabled>
        Newer →
      </button>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun',
                'Jul','Aug','Sep','Oct','Nov','Dec'];

// ── Category group definitions ─────────────────────────────────────────────
// Groups the 14 buckets into colour-coded header bands.
const GROUPS = [
  { label:'Fixed',     catCls:'cat-fixed',    subCls:'sub-fixed',
    ids:[1,2],         short:{ 1:'Mortg.', 2:'Prof.' } },
  { label:'Monthly',   catCls:'cat-monthly',  subCls:'sub-monthly',
    ids:[3,4],         short:{ 3:'M.Ess.', 4:'M.Disc.' } },
  { label:'Annual Ess.',catCls:'cat-annual',  subCls:'sub-annual',
    ids:[5,6,7,8,9],   short:{ 5:'Car', 6:'Home', 7:'Health',
                               8:'Travel', 9:'Tech' } },
  { label:'Expected',  catCls:'cat-expected', subCls:'sub-expected',
    ids:[10,11],       short:{ 10:'Car Rep.', 11:'H.Pump' } },
  { label:'Unknown',   catCls:'cat-unknown',  subCls:'sub-unknown',
    ids:[12],          short:{ 12:'Unknwn' } },
  { label:'Yolo',      catCls:'cat-yolo',     subCls:'sub-yolo',
    ids:[13,14],       short:{ 13:'Yolo M.', 14:'Yolo A.' } },
];

// Flat ordered bucket list (populated after loadBuckets)
let buckets = [];

// DOM
const thead    = document.getElementById('tableHead');
const tbody    = document.getElementById('tableBody');
const loading  = document.getElementById('loadingMsg');
const errorMsg = document.getElementById('errorMsg');
const viewWrap = document.getElementById('viewContainer');
const olderBtn = document.getElementById('olderBtn');
const newerBtn = document.getElementById('newerBtn');
const pageInfo = document.getElementById('pageInfo');

let currentOffset = 0;
let hasMore       = false;

function token()      { return localStorage.getItem('token'); }
function apiHeaders() {
  return { 'Content-Type':'application/json', 'Authorization':`Bearer ${token()}` };
}
function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.remove('hidden'); }
function hideError()    { errorMsg.classList.add('hidden'); }

function fmt(val) {
  if (val == null) return '—';
  return '£' + Number(val).toLocaleString('en-GB', {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}

// ── Load rollover (also gives us bucket list + balances) ───────────────────
async function loadBuckets() {
  const res = await fetch('/api/rollover', { headers: apiHeaders() });
  if (!res.ok) {
    if (res.status === 401) { location.href = '/login'; return; }
    throw new Error(`Failed to load rollover (${res.status})`);
  }
  const data = await res.json();
  buckets = data.map(r => ({
    id: r.bucket_id, name: r.display_name,
    total_allocated: r.total_allocated,
    total_spent: r.total_spent,
    total_rollover: r.total_allocated - r.total_spent
  }));
}

// ── Build two-row header ───────────────────────────────────────────────────
function buildHeader() {
  // Row 1 — category group labels with colours
  const tr1 = document.createElement('tr');

  // Month cell (spans 2 header rows + 2 data sub-rows via rowspan on data)
  const thMonth = document.createElement('th');
  thMonth.rowSpan = 2;
  thMonth.className = 'cat-sum text-left py-2.5 px-3 text-xs font-semibold sticky left-0 z-20 min-w-[90px]';
  thMonth.textContent = 'Month';
  tr1.appendChild(thMonth);

  // Type indicator column (A/S) - spans 2 header rows
  const thType = document.createElement('th');
  thType.rowSpan = 2;
  thType.className = 'cat-sum text-center py-2.5 px-1 text-xs sticky left-[90px] z-20 w-8';
  thType.textContent = '';
  tr1.appendChild(thType);

  // Category group header cells
  GROUPS.forEach(g => {
    const th = document.createElement('th');
    th.colSpan    = g.ids.length;
    th.className  = `${g.catCls} text-center py-2.5 px-2 text-xs font-semibold
                     border-l border-white/20 tracking-wide`;
    th.textContent = g.label;
    tr1.appendChild(th);
  });

  // Sum cell (spans 2 header rows)
  const thSum = document.createElement('th');
  thSum.rowSpan = 2;
  thSum.className = 'cat-sum text-right py-2.5 px-3 text-xs font-semibold border-l border-white/20 min-w-[80px]';
  thSum.textContent = 'Sum £';
  tr1.appendChild(thSum);

  // Row 2 — individual short bucket names
  const tr2 = document.createElement('tr');
  GROUPS.forEach(g => {
    g.ids.forEach(id => {
      const bkt = buckets.find(b => b.id === id);
      const th  = document.createElement('th');
      th.className = `${g.subCls} text-right py-2 px-2 text-xs font-medium
                      border-l border-white/10 min-w-[68px] tabnum`;
      th.textContent = g.short[id] || (bkt ? bkt.name : id);
      tr2.appendChild(th);
    });
  });

  thead.innerHTML = '';
  thead.appendChild(tr1);
  thead.appendChild(tr2);
}

// ── Build rollover summary rows (pinned at top of tbody) ────────────────────
function buildRolloverRow() {
  const rowBg = '#a9d6e5';

  function tdLabel(rowSpan, text) {
    const td = document.createElement('td');
    td.rowSpan = rowSpan;
    td.className = 'py-2 px-3 text-xs font-bold text-[#012a4a] uppercase tracking-wider sticky left-0 z-10';
    td.style.background = rowBg;
    td.textContent = text;
    return td;
  }

  function tdType(rowSpan, html) {
    const td = document.createElement('td');
    td.rowSpan = rowSpan;
    td.className = 'py-1.5 px-1 text-center sticky left-[90px] z-10';
    td.style.background = rowBg;
    td.innerHTML = html;
    return td;
  }

  function tdVal(value, cls) {
    const td = document.createElement('td');
    td.className = 'py-1.5 px-2 text-right text-xs tabnum' + (cls ? ' ' + cls : '');
    td.textContent = fmt(value);
    return td;
  }

  function tdSum(value, cls) {
    const td = document.createElement('td');
    td.className = 'py-1.5 px-3 text-right text-xs tabnum border-l border-[#89c2d9]' + (cls ? ' ' + cls : '');
    td.textContent = fmt(value);
    return td;
  }

  // ── Row A: Total allocated ────────────────────────────────────────────
  const trA = document.createElement('tr');
  trA.className = 'border-b border-[#89c2d9]/40';
  trA.style.background = rowBg;
  trA.appendChild(tdLabel(3, 'Total'));
  trA.appendChild(tdType(3, '<span class="type-a">A</span>'));
  buckets.forEach(b => trA.appendChild(tdVal(b.total_allocated, 'text-[#468faf]')));
  trA.appendChild(tdSum(
    buckets.reduce((s, b) => s + b.total_allocated, 0),
    'text-[#468faf] font-medium'
  ));
  tbody.appendChild(trA);

  // ── Row S: Total spent ────────────────────────────────────────────────
  const trS = document.createElement('tr');
  trS.className = 'border-b border-[#89c2d9]/60';
  trS.style.background = rowBg;
  buckets.forEach(b => trS.appendChild(tdVal(b.total_spent, 'text-[#013a63] font-medium')));
  trS.appendChild(tdSum(
    buckets.reduce((s, b) => s + b.total_spent, 0),
    'text-[#013a63] font-bold'
  ));
  tbody.appendChild(trS);

  // ── Row D: Difference (rollover) ──────────────────────────────────────
  const trD = document.createElement('tr');
  trD.className = 'border-b-2 border-[#89c2d9]';
  trD.style.background = rowBg;
  buckets.forEach(b => {
    const td = tdVal(b.total_rollover, 'font-medium');
    td.style.color = b.total_rollover >= 0 ? '#15803d' : '#dc2626';
    trD.appendChild(td);
  });
  const totalRollover = buckets.reduce((s, b) => s + b.total_rollover, 0);
  const tdDRow = tdSum(totalRollover, 'font-bold');
  tdDRow.style.color = totalRollover >= 0 ? '#15803d' : '#dc2626';
  trD.appendChild(tdDRow);
  tbody.appendChild(trD);
}

// ── Render one month as three rows (allocated, spent, difference) ─────────
function renderMonth(m, isEven) {
  const byId  = {};
  m.entries.forEach(e => { byId[e.bucket_id] = e; });

  const monthLabel  = `${MONTHS[m.month - 1]} ${m.year}`;
  const rowBg       = isEven ? '#ffffff' : '#f0f8fc';
  const rowBgHover  = '#a9d6e5';

  // ── Row 1: allocated ───────────────────────────────────────────────────
  const trA = document.createElement('tr');
  trA.className = 'border-b border-[#89c2d9]/40';
  trA.style.background = rowBg;
  trA.onmouseenter = () => {
    [trA, trS, trD].forEach(r => r.style.background = rowBgHover);
  };
  trA.onmouseleave = () => {
    [trA, trS, trD].forEach(r => r.style.background = rowBg);
  };

  // Month label — rowSpan=3, spans allocated / spent / difference rows
  const tdMonth = document.createElement('td');
  tdMonth.rowSpan = 3;
  tdMonth.className = 'py-2 px-3 font-semibold text-[#013a63] text-sm sticky left-0 z-10 align-middle month-link';
  tdMonth.style.background = rowBg;
  tdMonth.textContent = monthLabel;
  tdMonth.title = `Edit ${monthLabel}`;
  tdMonth.addEventListener('click', () => {
    location.href = `/entry?year=${m.year}&month=${m.month}`;
  });
  trA.appendChild(tdMonth);

  // Type badge — "A" for allocated
  const tdTypeA = document.createElement('td');
  tdTypeA.className = 'py-1.5 px-1 text-center sticky left-[90px] z-10';
  tdTypeA.style.background = rowBg;
  tdTypeA.innerHTML = '<span class="type-a">A</span>';
  trA.appendChild(tdTypeA);

  // Allocated values per bucket
  buckets.forEach(b => {
    const e  = byId[b.id];
    const td = document.createElement('td');
    td.className = 'py-1.5 px-2 text-right text-xs text-[#468faf] tabnum';
    td.textContent = e && e.allocated != null ? fmt(e.allocated) : '—';
    trA.appendChild(td);
  });

  // Allocated sum
  const allocSum = m.entries.reduce((s,e) => s + (e.allocated || 0), 0);
  const tdASum = document.createElement('td');
  tdASum.className = 'py-1.5 px-3 text-right text-xs text-[#468faf] font-medium tabnum border-l border-[#89c2d9]';
  tdASum.textContent = fmt(allocSum);
  trA.appendChild(tdASum);

  // ── Row 2: spent ───────────────────────────────────────────────────────
  const trS = document.createElement('tr');
  trS.className = 'border-b border-[#89c2d9]/60';
  trS.style.background = rowBg;
  trS.onmouseenter = () => {
    [trA, trS, trD].forEach(r => r.style.background = rowBgHover);
  };
  trS.onmouseleave = () => {
    [trA, trS, trD].forEach(r => r.style.background = rowBg);
  };

  // Type badge — "S" for spent
  const tdTypeS = document.createElement('td');
  tdTypeS.className = 'py-1.5 px-1 text-center sticky left-[90px] z-10';
  tdTypeS.style.background = rowBg;
  tdTypeS.innerHTML = '<span class="type-s">S</span>';
  trS.appendChild(tdTypeS);

  // Spent values per bucket
  buckets.forEach(b => {
    const e  = byId[b.id];
    const td = document.createElement('td');
    if (e && e.spent != null) {
      td.className  = 'py-1.5 px-2 text-right text-xs font-medium text-[#013a63] tabnum';
      td.textContent = fmt(e.spent);
    } else {
      td.className  = 'py-1.5 px-2 text-right text-xs text-[#89c2d9] tabnum';
      td.textContent = '—';
    }
    trS.appendChild(td);
  });

  // Spent sum
  const spentSum = m.entries.reduce((s,e) => s + (e.spent || 0), 0);
  const tdSSum = document.createElement('td');
  tdSSum.className = 'py-1.5 px-3 text-right text-xs font-bold tabnum border-l border-[#89c2d9]';
  tdSSum.style.color = '#013a63';
  tdSSum.textContent = fmt(spentSum);
  trS.appendChild(tdSSum);

  // ── Row 3: difference (allocated - spent) ──────────────────────────────
  const trD = document.createElement('tr');
  trD.className = 'border-b border-[#89c2d9]/40';
  trD.style.background = rowBg;
  trD.onmouseenter = () => {
    [trA, trS, trD].forEach(r => r.style.background = rowBgHover);
  };
  trD.onmouseleave = () => {
    [trA, trS, trD].forEach(r => r.style.background = rowBg);
  };

  const tdTypeD = document.createElement('td');
  tdTypeD.className = 'py-1.5 px-1 text-center sticky left-[90px] z-10';
  tdTypeD.style.background = rowBg;
  tdTypeD.innerHTML = '<span class="type-d">D</span>';
  trD.appendChild(tdTypeD);

  buckets.forEach(b => {
    const e  = byId[b.id];
    const td = document.createElement('td');
    td.className = 'py-1.5 px-2 text-right text-xs font-medium tabnum';
    if (e && (e.allocated != null || e.spent != null)) {
      const diff = (e.allocated || 0) - (e.spent || 0);
      td.style.color = diff >= 0 ? '#15803d' : '#dc2626';
      td.textContent = fmt(diff);
    } else {
      td.className += ' text-[#89c2d9]';
      td.textContent = '—';
    }
    trD.appendChild(td);
  });

  const totalDiff = m.entries.reduce((s, e) => s + ((e.allocated || 0) - (e.spent || 0)), 0);
  const tdDSum = document.createElement('td');
  tdDSum.className = 'py-1.5 px-3 text-right text-xs font-bold tabnum border-l border-[#89c2d9]';
  tdDSum.style.color = totalDiff >= 0 ? '#15803d' : '#dc2626';
  tdDSum.textContent = fmt(totalDiff);
  trD.appendChild(tdDSum);

  tbody.appendChild(trA);
  tbody.appendChild(trS);
  tbody.appendChild(trD);
}

// ── Pagination state ───────────────────────────────────────────────────────
function updatePagination() {
  olderBtn.disabled = !hasMore;
  newerBtn.disabled = currentOffset === 0;
  pageInfo.textContent = `Page ${currentOffset + 1}`;
}

// ── Load view data ─────────────────────────────────────────────────────────
async function loadView() {
  hideError();
  loading.classList.remove('hidden');
  viewWrap.classList.add('hidden');

  try {
    const res = await fetch(`/api/view?offset=${currentOffset}`,
                            { headers: apiHeaders() });
    if (!res.ok) {
      if (res.status === 401) { location.href = '/login'; return; }
      throw new Error(`Server error ${res.status}`);
    }
    const data = await res.json();

    tbody.innerHTML = '';
    buildRolloverRow();
    data.months.forEach((m, i) => renderMonth(m, i % 2 === 0));

    hasMore = data.has_more;
    updatePagination();
    loading.classList.add('hidden');
    viewWrap.classList.remove('hidden');

  } catch(err) {
    loading.classList.add('hidden');
    showError(err.message);
  }
}

// ── Pagination handlers ────────────────────────────────────────────────────
olderBtn.addEventListener('click', () => {
  if (!hasMore) return;
  currentOffset++; loadView();
});
newerBtn.addEventListener('click', () => {
  if (currentOffset === 0) return;
  currentOffset--; loadView();
});

// ── Init ───────────────────────────────────────────────────────────────────
loadBuckets()
  .then(() => { buildHeader(); loadView(); })
  .catch(err => {
    loading.classList.add('hidden');
    showError(err.message);
  });
</script>
{% endblock %}
